[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "larkagentd"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "cryptography>=44", "httpx>=0.28,<1", "lark-oapi==1.7.5", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.9"]
group-brain = ["mem0ai==2.2.1"]
mcp = ["mcp==1.26.0"]

[project.scripts]
larkagentd = "larkagentd.gateway.main:main"
larkagentd-tools = "larkagentd.toolservice.toolservice:main"
larkagentd-tool-admin = "larkagentd.toolservice.toolsadmin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"larkagentd.skills" = ["builtin/*/SKILL.md"]
"larkagentd.gateway" = ["static/index.html", "static/larkagentd.svg", "static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
