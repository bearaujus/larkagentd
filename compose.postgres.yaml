# Local database: make run starts and provisions it; make spawn-db does so on its own.
name: larkagentd
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-trixie
    environment:
      POSTGRES_USER: larkagentd
      POSTGRES_PASSWORD: larkagentd
      POSTGRES_DB: larkagentd
      GROUP_BRAIN_COLLECTION: "${GROUP_BRAIN_COLLECTION:-group_brain_v1}"
      GROUP_BRAIN_EMBEDDING_DIMENSIONS: "${GROUP_BRAIN_EMBEDDING_DIMENSIONS:-1024}"
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:
