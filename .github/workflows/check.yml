name: Check
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testagent
          POSTGRES_PASSWORD: testagent
          POSTGRES_DB: larkagentd_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U testagent" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://testagent:testagent@127.0.0.1:5432/larkagentd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev,mcp]'
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - run: make lint PYTHON=python
      - run: make ui-check ui-build
      - run: pytest -q -n 4
      - run: npm --prefix frontend test -- --project=chromium
